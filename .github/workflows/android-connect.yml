name: WealthOS Connect Android

on:
  workflow_dispatch:
  push:
    branches: [wealthos/render-beta]
    paths:
      - 'mobile/android/**'
      - '.github/workflows/android-connect.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build debug APK
        shell: bash
        run: |
          set +e
          gradle :app:assembleDebug --stacktrace 2>&1 | tee gradle-build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -E '(^e: | error: |FAILURE:|What went wrong|Execution failed for task|Caused by:|Unresolved reference|Type mismatch|Cannot access|does not exist)' gradle-build.log > gradle-errors.log || true
            if [ ! -s gradle-errors.log ]; then
              tail -n 80 gradle-build.log > gradle-errors.log
            fi
            message=$(tail -n 100 gradle-errors.log | sed 's/%/%25/g; s/\r/%0D/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Android build failed::$message"
          fi
          exit "$status"
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WealthOS-Connect-build-log
          path: mobile/android/gradle-build.log
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: WealthOS-Connect-debug
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
