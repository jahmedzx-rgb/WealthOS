name: WealthOS Connect Android

on:
  workflow_dispatch:
  push:
    branches: [wealthos/render-beta]
    paths:
      - 'mobile/android/**'
      - '.github/workflows/android-connect.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Prepare protected release signing
        shell: bash
        env:
          WEALTHOS_KEYSTORE_BASE64: ${{ secrets.WEALTHOS_KEYSTORE_BASE64 }}
        run: |
          test -n "$WEALTHOS_KEYSTORE_BASE64"
          printf '%s' "$WEALTHOS_KEYSTORE_BASE64" | base64 --decode > wealthos-release.p12
          chmod 600 wealthos-release.p12
      - name: Build signed release APK
        shell: bash
        env:
          WEALTHOS_STORE_FILE: ../wealthos-release.p12
          WEALTHOS_STORE_PASSWORD: ${{ secrets.WEALTHOS_KEYSTORE_PASSWORD }}
        run: |
          set +e
          gradle :app:assembleRelease --stacktrace 2>&1 | tee gradle-build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -E '(^e: | error: |FAILURE:|What went wrong|Execution failed for task|Caused by:|Unresolved reference|Type mismatch|Cannot access|does not exist)' gradle-build.log > gradle-errors.log || true
            if [ ! -s gradle-errors.log ]; then
              tail -n 80 gradle-build.log > gradle-errors.log
            fi
            message=$(tail -n 100 gradle-errors.log | sed 's/%/%25/g; s/\r/%0D/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Android build failed::$message"
          fi
          exit "$status"
      - name: Verify signature and restricted permissions
        shell: bash
        run: |
          apk="app/build/outputs/apk/release/app-release.apk"
          apksigner=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          aapt=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
          test -x "$apksigner"
          test -x "$aapt"
          "$apksigner" verify --verbose --print-certs "$apk"
          permissions=$("$aapt" dump permissions "$apk")
          printf '%s\n' "$permissions"
          if printf '%s\n' "$permissions" | grep -Eq 'android.permission.(READ_SMS|RECEIVE_SMS)'; then
            echo "::error title=Restricted SMS permission::Release APK still requests a restricted SMS permission."
            exit 1
          fi
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WealthOS-Connect-build-log
          path: mobile/android/gradle-build.log
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: WealthOS-Connect-release
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
