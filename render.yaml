services:
  - type: web
    name: wealthos-web-beta
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile.web
    dockerContext: .
    autoDeployTrigger: "off"
    healthCheckPath: /ready
    maxShutdownDelaySeconds: 30
    envVars:
      - key: DEBUG
        value: "false"
      - key: WEB_MODE
        value: "true"
      - key: APP_VERSION
        value: 0.2.0-beta.1
      - key: MIGRATION_HEAD
        value: d7c13a5d4f93
      - key: WEB_SESSION_HOURS
        value: "12"
      - key: WEB_MAX_USERS
        value: "10"
      - key: COOKIE_SECURE
        value: "true"
      - key: TRUSTED_HOSTS
        value: wealthos-web-beta.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: wealthos-beta-db
          property: connectionString
