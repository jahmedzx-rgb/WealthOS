services:
  - type: web
    name: wealthos-web-beta
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile.web
    dockerContext: .
    autoDeployTrigger: "off"
    healthCheckPath: /ready
    preDeployCommand: python -m deploy.run_migrations
    maxShutdownDelaySeconds: 30
    envVars:
      - key: DEBUG
        value: "false"
      - key: WEB_MODE
        value: "true"
      - key: APP_VERSION
        value: 0.2.0-beta.1
      - key: MIGRATION_HEAD
        value: a1b2c3d4e5f6
      - key: WEB_SESSION_HOURS
        value: "12"
      - key: WEB_MAX_USERS
        value: "3"
      - key: COOKIE_SECURE
        value: "true"
      - key: TRUSTED_HOSTS
        value: wealthos-web-beta.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: wealthos-main-db-2026
          property: connectionString
      - key: WEB_ADMIN_INVITE_CODE
        sync: false
      - key: WEB_INVITE_CODES
        sync: false

databases:
  - name: wealthos-main-db-2026
    plan: 0.1c-256mb
    diskSizeGB: 1
    postgresMajorVersion: "17"
    ipAllowList: []
